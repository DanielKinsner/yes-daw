name: ci

# The mechanical gate. Every push to main and every PR builds the app and runs the headless,
# self-asserting DSP check on Windows + Linux + macOS (H0's exit names Win+mac; Linux is the
# cheapest portability signal and where the RTSan leg will live). A green check here IS the
# verification — no human reads a diff or listens to the tone.
#
# CI builds the GUI app (proves it compiles + links) but never RUNS it (runners have no display
# or audio device). Only the pure, headless YesDawCheck is executed, via ctest.
#
# Everything runs through the `ci` CMake preset (Ninja/Release) so the cloud and all three of
# Dan's machines invoke it byte-identically and path-free.
#
# Speed (2026-08-11): two mechanisms, neither weakens the gate.
# 1. sccache (GitHub Actions cache backend) fronts the compilers on the heavy build jobs, so a
#    commit only recompiles the translation units it touched. Cache misses fall back to a plain
#    compile. An unavailable cache startup also compiles directly; all build/test gates remain.
# 2. A docs-only push (every changed path is docs/ or *.md) skips the build jobs entirely: its
#    tree is code-identical to its parent, whose own exact-head run already proved all nine jobs.
#    The classifier is deliberately conservative — PRs, first commits, and anything unrecognized
#    run the full matrix.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never a main-push run — every commit on main must keep its own
  # green/red verdict so `git bisect run ctest --preset ci` stays mechanical.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only fast path: classify the diff. Conservative by construction — only a push whose
  # entire parent diff is documentation may skip the build jobs; every other shape (PR, first
  # commit, diff error, any non-docs path) runs the full matrix.
  changes:
    name: Classify diff (docs-only fast path)
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The WHOLE pushed range must be docs-only, not just its last commit: GitHub runs only the head
      # of a multi-commit push, so a docs commit on top would otherwise skip the code commits beneath
      # it (2026-10-05: three code commits were reported green by a 7 s docs-only run). The range
      # starts at the previous head, which had its own run. A missing or unfetchable previous head
      # (new branch, force-push) runs the full matrix.
      - id: classify
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          code=true
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BEFORE" >/dev/null 2>&1; then
            changed="$(git diff --name-only "$BEFORE" HEAD)"
            echo "changed files:"
            echo "$changed"
            # Allowlist: docs/** and *.md anywhere. Anything else keeps code=true.
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^docs/|\.md$'; then
              code=false
            fi
          fi
          echo "docs-only fast path: code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false          # one OS failing must not hide the others (the agent triages, not Dan)
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux,   os: ubuntu-22.04 }
          - { name: macOS,   os: macos-15 }
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Test bounded Linux dependency setup
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: bash tools/tests/install-linux-deps-tests.sh

      # JUCE's GUI modules need X11/ALSA/etc to link on Linux. webkit + curl are deliberately
      # OMITTED: JUCE_WEB_BROWSER=0 / JUCE_USE_CURL=0 compile out their only consumers, and
      # libwebkit2gtk-4.1-dev isn't reliably present on the ubuntu-22.04 image (the 4.0/4.1 trap).
      - name: Linux deps
        if: runner.os == 'Linux'
        timeout-minutes: 14
        run: bash tools/install-linux-deps.sh base

      # Ninja (from the preset) needs cl.exe on PATH; this loads the MSVC environment.
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get CMake + Ninja (consistent across all runners)
        uses: lukka/get-cmake@latest

      - name: Set up sccache (compiler cache)
        uses: mozilla/sccache-action@v0.0.9
        with:
          disable_annotations: true

      # Cache the fetched JUCE + Catch2 sources so we don't re-clone them every run.
      # Keyed to the pinned tags + CMakeLists so bumping a dependency busts the cache.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-ci/_deps
          key: deps-${{ runner.os }}-juce8.0.4-catch3.7.1-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-juce8.0.4-catch3.7.1-

      - name: Test CI cache fallback
        run: cmake "-DTEST_ROOT=${{ runner.temp }}/ci-configure-regression" -P tools/tests/configure-ci-tests.cmake

      - name: Test actual cache startup policy
        run: python tools/tests/configure-ci-startup-tests.py --output "${{ runner.temp }}/ci-cache-startup-regression"

      - name: Test local Clang diagnostic policy
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tools/tests/clang-diagnostic-policy-tests.ps1

      - name: Configure (Release — Debug hangs on JUCE asserts in CI)
        id: configure
        run: cmake -DYESDAW_CI_CACHE_PROBE=startup -P tools/configure-ci.cmake

      - name: Build (GUI app + headless test)
        run: cmake --build --preset ci

      - name: sccache stats
        if: steps.configure.outputs.cache_enabled == 'true'
        continue-on-error: true
        run: sccache --show-stats

      - name: Test (headless DSP self-check)
        run: ctest --preset ci

  # Real-time safety: compile the pure tests with -fsanitize=realtime and run them. RTSan ABORTS if any
  # [[clang::nonblocking]] (YESDAW_RT_HOT) hot path ever allocates, locks, or does I/O. That now spans the
  # whole engine (Runtime::processBlock -> CompiledGraph::process -> every Node::process), not just the
  # retired SineSource spike — CLAUDE.md's "audio thread never allocates" rule, enforced mechanically. Needs Clang 20+
  # (where RTSan landed). YesDawCheck is pure (no JUCE), so no X11/audio deps are required here.
  rtsan:
    name: RTSan (audio thread no-alloc)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      RTSAN_OPTIONS: "halt_on_error=1:suppressions=${{ github.workspace }}/rtsan_suppressions.txt"
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 20 + Ninja
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y ninja-build

      # YESDAW_BUILD_APPS=OFF -> only the pure Catch2 test is configured, so this leg needs neither
      # the JUCE clone nor the X11/ALSA dev libs JUCE's modules require at configure time.
      - name: Configure (RTSan, Clang 20, test-only)
        run: >
          cmake -B build-rt -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          -DYESDAW_BUILD_APPS=OFF -DYESDAW_SANITIZER=realtime

      # Build ALL configured targets: with YESDAW_BUILD_APPS=OFF that's exactly the pure test exes
      # (no JUCE), so every test target exists and ctest finds no unbuilt sentinels.
      - name: Build the headless tests
        run: cmake --build build-rt

      - name: Run under RTSan (aborts on a real-time violation)
        run: ctest --test-dir build-rt --output-on-failure --no-tests=error

  # Data-race safety: compile the pure tests with -fsanitize=thread and run them. RTSan proves the audio
  # thread never allocates/locks; only TSan proves the release/acquire contract the Runtime's
  # publish/process/reclaim path relies on (ADR-0006) actually has no data race. The 2-thread Runtime
  # stress test is the target. Mirrors the rtsan leg (Clang 20, pure tests, no JUCE) — but with NO
  # -Wl,-z,now (that is RTSan-specific) and YESDAW_SANITIZER=thread.
  tsan:
    name: TSan (audio<->control data races)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      TSAN_OPTIONS: "halt_on_error=1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 20 + Ninja
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y ninja-build

      - name: Configure (TSan, Clang 20, test-only)
        run: >
          cmake -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          -DYESDAW_BUILD_APPS=OFF -DYESDAW_SANITIZER=thread

      - name: Build the headless tests
        run: cmake --build build-tsan

      - name: Run under TSan (aborts on a data race)
        run: ctest --test-dir build-tsan --output-on-failure --no-tests=error

  # H17 CP3: prove the portable zip actually works. Build via the ci preset, run the packaging
  # script, then extract the zip into a clean temp dir OUTSIDE the checkout and run the packaged
  # self-check there — a repo-independence proof (the shipped binary must not need the source tree),
  # plus a guard that a real git-describe version was baked in (not the unstamped fallback).
  package:
    name: Package (portable zip + packaged self-check)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        timeout-minutes: 14
        run: bash tools/install-linux-deps.sh package

      - name: Get CMake + Ninja (consistent across all runners)
        uses: lukka/get-cmake@latest

      - name: Set up sccache (compiler cache)
        uses: mozilla/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-ci/_deps
          key: deps-${{ runner.os }}-juce8.0.4-catch3.7.1-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-juce8.0.4-catch3.7.1-

      - name: Configure (Release)
        id: configure
        run: cmake -DYESDAW_CI_CACHE_PROBE=startup -P tools/configure-ci.cmake

      - name: Package (build GUI + self-check, stage, zip)
        run: tools/package.sh

      - name: Run the packaged self-check from a clean temp dir (repo-independence)
        run: |
          set -euo pipefail
          zip="$(ls dist/YesDaw-*-linux-portable.zip)"
          echo "packaged zip: $zip"
          clean="$(mktemp -d)"
          unzip -q "$zip" -d "$clean"
          pkg="$(ls -d "$clean"/YesDaw-*-linux-portable)"
          expected="$(cat "$pkg/version.txt")"
          echo "version.txt: $expected"
          # Reject the unstamped fallbacks — a real git-describe value must have been baked in.
          case "$expected" in
            0.0.0-nogit|0.0.0-dev|"") echo "FAIL: version.txt is an unstamped fallback ('$expected')"; exit 1 ;;
          esac
          # Run the shipped binary from OUTSIDE the repo checkout (prove it needs no source tree).
          cd /
          out="$("$pkg/YesDawSelfCheck" --version)"
          echo "packaged --version: $out"
          case "$out" in
            *"$expected"*) echo "OK: packaged self-check reports the staged version ($expected)" ;;
            *) echo "FAIL: packaged --version ('$out') does not contain version.txt ('$expected')"; exit 1 ;;
          esac

  # H17 packaged verifier (U5): build the WINDOWS portable zip, extract it OUTSIDE the checkout,
  # change to an unrelated working directory (with a space in it - R2), and run the packaged
  # verify-hardware.ps1 -SelfTest under Windows PowerShell 5.1 (the compatibility floor). That
  # exercises the verdict-policy fixture lockstep AND the full R20 package mutation inventory
  # (manifest missing/invalid file/size/hash/path-escape/version, child-hang kill mechanics) on
  # disposable package copies. No hardware PASS is claimed - CI has no audio device; -IntegrityOnly
  # and -SelfTest are device-free by construction.
  package-windows:
    name: Package (Windows zip + packaged hardware-verifier self-test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get CMake + Ninja (consistent across all runners)
        uses: lukka/get-cmake@latest

      - name: Set up sccache (compiler cache)
        uses: mozilla/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-ci/_deps
          key: deps-${{ runner.os }}-juce8.0.4-catch3.7.1-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-juce8.0.4-catch3.7.1-

      - name: Configure (Release)
        id: configure
        run: cmake -DYESDAW_CI_CACHE_PROBE=startup -P tools/configure-ci.cmake

      - name: Package (build GUI + self-check + hardware checkers, stage, manifest, zip)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\package.ps1

      - name: Packaged verifier self-test from a clean extraction outside the checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem dist\YesDaw-*-win64-portable.zip)[0].FullName
          Write-Host "packaged zip: $zip"
          $clean = Join-Path $env:RUNNER_TEMP 'yd-pkg'
          Expand-Archive -LiteralPath $zip -DestinationPath $clean
          $pkg = (Get-ChildItem $clean -Directory)[0].FullName
          $expected = (Get-Content (Join-Path $pkg 'version.txt') -Raw).Trim()
          Write-Host "version.txt: $expected"
          if ($expected -eq '' -or $expected -eq '0.0.0-nogit' -or $expected -eq '0.0.0-dev') {
            Write-Error "version.txt is an unstamped fallback ('$expected')"
            exit 1
          }
          # Unrelated working directory, deliberately containing a space (R2).
          $work = Join-Path $env:RUNNER_TEMP 'un related'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $pkg 'verify-hardware.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) {
            Write-Error "packaged verify-hardware.ps1 -SelfTest failed (exit $LASTEXITCODE)"
            exit 1
          }

      # Downloadable builds (2026-11-03, Dan: "build the release package so that I can download it").
      # Every run keeps the Windows zip as an artifact; a push to main also publishes it on the rolling
      # `alpha-latest` pre-release, so any machine can download the newest green build without a toolchain.
      - name: Keep the Windows zip as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: YesDaw-win64-portable
          path: dist/YesDaw-*-win64-portable.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish the zip on the rolling alpha-latest pre-release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$(ls dist/YesDaw-*-win64-portable.zip | head -1)"
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          ver="$(cat "$tmp"/yd-pkg/*/version.txt | tr -d '\r\n')"
          notes="Rolling build of main. Version $ver (commit ${GITHUB_SHA:0:7}). Unzip anywhere and run YesDaw.exe; no install, no toolchain. Replaced on every green push to main."
          if ! gh release view alpha-latest >/dev/null 2>&1; then
            gh release create alpha-latest --prerelease --title "YES DAW alpha (latest main)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          # one zip on the release: drop older-version assets before uploading this one
          gh release view alpha-latest --json assets -q '.assets[].name' | while read -r name; do
            [ "$name" = "$(basename "$zip")" ] || gh release delete-asset alpha-latest "$name" -y
          done
          gh release upload alpha-latest "$zip" --clobber
          gh release edit alpha-latest --notes "$notes"
          echo "published $(basename "$zip") as alpha-latest ($ver)"

  # H17 CP5: exercise tools/alpha-verify (the alpha-gate mechanical companion). Builds only the
  # YesDawSelfCheck CLI, then runs the script's --self-test, which proves each of the 5 alpha asserts
  # FAILS on a synthetic bad input (empty export, garbage WAV, out-of-range loudness, non-bundle,
  # missing autosave) — the implementer-brief #8 negative controls. The full POSITIVE pass needs a
  # real produced song (CP2 / an owner session) and is intentionally not run here. Both the POSIX
  # (.sh) and Windows (.ps1) scripts are covered.
  alpha-verify:
    name: Alpha-verify self-test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        timeout-minutes: 14
        run: bash tools/install-linux-deps.sh base

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Get CMake + Ninja (consistent across all runners)
        uses: lukka/get-cmake@latest

      - name: Set up sccache (compiler cache)
        uses: mozilla/sccache-action@v0.0.9
        with:
          disable_annotations: true

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-ci/_deps
          key: deps-${{ runner.os }}-juce8.0.4-catch3.7.1-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-juce8.0.4-catch3.7.1-

      - name: Configure (Release)
        id: configure
        run: cmake -DYESDAW_CI_CACHE_PROBE=startup -P tools/configure-ci.cmake

      - name: Build the self-check CLI
        run: cmake --build --preset ci --target YesDawSelfCheck

      - name: Alpha-verify self-test (POSIX)
        if: runner.os == 'Linux'
        run: tools/alpha-verify.sh --self-test

      - name: Alpha-verify self-test (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File tools\alpha-verify.ps1 -SelfTest

      # H17 CP2: the full POSITIVE pass — generate a real demo bundle+mix (--make-demo) then run all 5
      # alpha asserts on it. This closes CP5's mechanical gate end-to-end (positive + negative) in CI.
      - name: Make demo + alpha-verify POSITIVE pass (POSIX)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sc="build-ci/YesDawSelfCheck_artefacts/Release/YesDawSelfCheck"
          demo="$(mktemp -d)"
          "$sc" --make-demo "$demo"
          tools/alpha-verify.sh --bundle "$demo/demo.yesdaw" --wav "$demo/demo.wav"

      - name: Make demo + alpha-verify POSITIVE pass (Windows)
        if: runner.os == 'Windows'
        run: |
          $sc = "build-ci\YesDawSelfCheck_artefacts\Release\YesDawSelfCheck.exe"
          $demo = Join-Path $env:RUNNER_TEMP ("demo-" + [System.Guid]::NewGuid().ToString('N'))
          & $sc --make-demo $demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy Bypass -File tools\alpha-verify.ps1 -Bundle "$demo\demo.yesdaw" -Wav "$demo\demo.wav"
